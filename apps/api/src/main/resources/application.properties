# Configuración local. Producción: solo application-production.properties + variables de entorno.
spring.application.name=hotel-api
server.port=8080

# Ambiente: dev | produccion. En produccion se NIEGA el arranque si se activa el usuario demo.
hotel.ambiente=${HOTEL_AMBIENTE:dev}

# Ruta del archivo SQLite. En Docker: /data/hotel.sqlite3 (volumen nombrado).
hotel.jdbc-path=${JDBC_URL:jdbc:sqlite:./data/hotel.sqlite3}

# Token de arranque del primer administrador. Vacío = arranque deshabilitado.
hotel.admin-init-token=${ADMIN_INIT_TOKEN:}

# Usuario de demostración admin/admin. Solo con hotel.ambiente=dev; en produccion el arranque falla.
hotel.demo.admin=${HOTEL_DEMO_ADMIN:false}

# --- Envío de correo (OAuth 2.0 de Google + Gmail API) ---
# Vacío o deshabilitado: el servicio rechaza el envío diciendo por qué. Nunca finge un envío.
hotel.correo.habilitado=${CORREO_HABILITADO:false}
hotel.correo.remitente=${CORREO_REMITENTE:}
hotel.correo.remitente-nombre=${CORREO_REMITENTE_NOMBRE:Hotel}
hotel.correo.client-id=${GOOGLE_CLIENT_ID:}
hotel.correo.client-secret=${GOOGLE_CLIENT_SECRET:}
hotel.correo.refresh-token=${GOOGLE_REFRESH_TOKEN:}
# Solo pruebas: permite apuntar a otro host. Vacío = endpoints oficiales de Google.
hotel.correo.endpoint-oauth=${CORREO_ENDPOINT_OAUTH:}
hotel.correo.endpoint-gmail=${CORREO_ENDPOINT_GMAIL:}

# --- Login con Google (panel y huéspedes) ---
# Mismo Client ID que el correo: una credencial en Google Cloud, dos registros aquí
# (google-admin y google-huesped). Vacío = solo contraseña, que queda como respaldo.
hotel.oauth2.client-id=${GOOGLE_CLIENT_ID:}
hotel.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}
# Quién puede entrar al panel con Google, separados por comas. Vacío = nadie entra con Google.
hotel.oauth2.admin-emails=${GOOGLE_ADMIN_EMAILS:}

# Migraciones versionadas. Flyway + SQLite requiere el módulo de base de datos de la edición NC.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Sin detección de dialecto automática: la app habla SQL explícito a SQLite.
spring.jpa.hibernate.ddl-auto=none

server.forward-headers-strategy=framework

logging.level.root=INFO
logging.level.co.hotel=INFO
logging.level.org.springframework.security=INFO
server.tomcat.max-http-form-post-size=64KB