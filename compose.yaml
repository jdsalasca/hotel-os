services:
  api:
    build: ./apps/api
    environment:
      JDBC_URL: jdbc:sqlite:/data/hotel.sqlite3
      ADMIN_INIT_TOKEN: ${ADMIN_INIT_TOKEN:-}
    volumes:
      - hotel-data:/data
      - hotel-backups:/backups
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    depends_on:
      api:
        condition: service_started

volumes:
  hotel-data:
  hotel-backups:
